name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Type-check, test and check the packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
      - run: nub install --frozen-lockfile
      # lab/nextjs and lab/jest have their own dependencies; without them their tests are skipped
      - run: nub install --frozen-lockfile
        working-directory: lab/nextjs
      - run: nub install --frozen-lockfile
        working-directory: lab/jest
      # each example in examples/ has its own dependencies too (tests/examples.test.ts)
      - run: for dir in examples/*/; do (cd "$dir" && nub install --frozen-lockfile) || exit 1; done
      # examples/bun runs under Bun; release.yml leaves it out, so its jobs run no other third-party action, and the test skips it there
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: nub run typecheck
      - run: nub run test
      # the packages as release.yml stages them, installed from tarballs outside the repository
      - run: nub run build
      - run: nub run check-dist
